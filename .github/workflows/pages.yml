name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow one concurrent deployment; a queued run supersedes an older one rather
# than deploying stale files after a newer push.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # No build step — the repo root IS the site.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
